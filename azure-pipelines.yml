trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Deploy
  displayName: 'Deploy Stage'
  jobs:
  - deployment: DeployWeb
    displayName: 'Deploy to AWS EC2'
    environment:
      name: 'AWS_EC2'
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          # 👇 CRITICAL FIX: This downloads your index.html file to the VM
          - checkout: self 

          - script: |
              echo "=== Verifying repository contents ==="
              ls -la
              
              echo "=== Starting Deployment ==="
              # Ensure the target web server directory exists
              sudo mkdir -p /var/www/html/
              
              # Copy the index.html from your repository workspace to the web directory
              sudo cp -f ./index.html /var/www/html/
              
              echo "Deployment successful!"
            displayName: 'Deploy index.html to Nginx Web Server'
