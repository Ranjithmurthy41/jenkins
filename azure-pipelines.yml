trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Deploy
  displayName: 'Deploy Stage'
  jobs:
  - deployment: DeployWeb
    displayName: 'Deploy to AWS EC2'
    environment:
      name: 'AWS_EC2' # !!! Change this to match your exact Azure DevOps Environment name !!!
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              # Copy the index.html file to the default Nginx web directory
              sudo cp $(Pipeline.Workspace)/s/index.html /var/www/html/
            displayName: 'Deploy index.html to Nginx Web Server'
